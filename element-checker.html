<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Non-Metal Elements</title>

    <link rel="stylesheet"
          href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module"
            src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                ICT10 Q2 Portfolio
            </a>

            <div class="d-flex gap-2 flex-wrap">
                <a class="btn btn-sm btn-light" href="index.html">
                    Home
                </a>
                <a class="btn btn-sm btn-light"
                   href="club-members.html">
                    Club Members
                </a>
                <a class="btn btn-sm btn-light"
                   href="meet-the-creator.html">
                    Creator
                </a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="container p-4 bg-light text-dark rounded shadow-sm">
            <h1>Non-Metal Elements</h1>

            <p>
                Enter the symbol of a non-metal element to find its information.
            </p>

            <form>
                <input type="text"
                       id="element_input"
                       class="form-control mb-3"
                       placeholder="Enter element symbol (e.g. H, O, Cl)">

                <button type="button"
                        class="btn btn-primary"
                        py-click="search_element">
                    Check Details
                </button>
            </form>

            <div id="result" class="mt-4"></div>
        </div>
    </main>

    <py-script src="element_checker.py"></py-script>
</body>
</html>
