<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Basketball Varsity Members</title>

    <link rel="stylesheet"
          href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module"
            src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                ICT10 Q2 Portfolio
            </a>

            <div class="d-flex gap-2 flex-wrap">
                <a class="btn btn-sm btn-light" href="index.html">
                    Home
                </a>
                <a class="btn btn-sm btn-light"
                   href="element-checker.html">
                    Element Checker
                </a>
                <a class="btn btn-sm btn-light"
                   href="meet-the-creator.html">
                    Creator
                </a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="card shadow-sm p-4">
            <h1>Basketball Varsity Members</h1>

            <form class="row g-2">
                <div class="col-md-5">
                    <input id="first-name"
                           class="form-control"
                           type="text"
                           placeholder="First name">
                </div>

                <div class="col-md-5">
                    <input id="last-name"
                           class="form-control"
                           type="text"
                           placeholder="Last name">
                </div>

                <div class="col-md-2">
                    <button class="btn btn-primary w-100"
                            type="button"
                            py-click="add_member">
                        Add Member
                    </button>
                </div>
            </form>

            <div id="results" class="mt-4"></div>
        </div>
    </main>

    <py-script src="club_members.py"></py-script>
</body>
</html>
